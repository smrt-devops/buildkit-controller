apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitPool
metadata: {name: oidc-exclude, namespace: default}
spec:
  access:
    rules: [{oidc: {issuer: "https://a", claims: {repository_owner_id: "1", repo_property_domain: "*"}, exclude: {repo_property_domain: [pci, "x-*"]}}}]
  workers:
    cache:
      writers: [{oidc: {issuer: "https://a", claims: {event_name: push}, exclude: {repo_property_domain: [pci]}}}]
