apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitPool
metadata: {name: oidc-presence-claim, namespace: default}
spec:
  access:
    rules: [{oidc: {issuer: "https://a", claims: {repository_owner_id: "1", repo_property_domain: "*"}}}]
  workers:
    cache:
      writers: [{oidc: {issuer: "https://a", claims: {event_name: push, ref_protected: "true", repo_property_domain: "**"}}}]
