apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitPool
metadata: {name: mount-state-dir, namespace: default}
spec:
  template:
    spec:
      volumes: [{name: v, emptyDir: {}}]
      containers: [{name: buildkitd, volumeMounts: [{name: v, mountPath: "/home/user/.local/share/buildkit/x"}]}]
