[package]
name = "buildkit-controller-api"
description = "BuildKitPool CRD types, HTTP API DTOs and a typed client for buildkit-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Typed async HTTP client; the server does not enable this.
client = ["dep:reqwest", "dep:tokio"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
k8s-openapi = { workspace = true }
kube-core = { workspace = true }
kube-derive = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
axum = { workspace = true }
serde-saphyr = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
# Self dev-dependency: turns the `client` feature on for this crate's own tests.
buildkit-controller-api = { path = ".", version = "0.1.0", features = ["client"] }
