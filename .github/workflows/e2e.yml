name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust harness: mock OIDC issuer, curl recipe, buildx, registry cache,
  # queueing and multi-platform on a kind cluster (cargo xtask e2e).
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo xtask e2e

  # The cheap kind suites, on every pull request: the CRD against its fixtures, the rendered
  # objects server-side, and the chart installed on a cluster. Each leg has its own runner,
  # so none needs a BK_KIND_SUFFIX.
  kind:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [crd-verify, render-verify, helm-verify]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo xtask ${{ matrix.suite }}

  # examples/*.yaml against the CRDs in a real API server, so a field rename that breaks the files
  # the README tells users to apply fails here.
  examples:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Dry-run every example on a throwaway cluster
        run: |
          set -euo pipefail
          kind create cluster --name bk-examples --wait 120s
          trap 'kind delete cluster --name bk-examples' EXIT
          kubectl apply --server-side -f helm/buildkit-controller/crds/buildkitpools.yaml
          helm template bk helm/buildkit-controller --show-only templates/crd-buildkitclaims.yaml \
            --set claims.enabled=true --set 'claims.namespaces={apps}' --set gateway.enabled=false \
            --set edge.endpoint=tcp://bk.example.com:8444 --set edge.serverName=bk.example.com |
            kubectl apply --server-side -f -
          kubectl wait --for condition=established --timeout=60s crd --all
          kubectl create namespace ci
          kubectl create namespace apps
          for f in examples/pool-*.yaml examples/claim-pod.yaml; do
            echo "== $f"
            kubectl apply --dry-run=server --validate=strict -f "$f"
          done

  # The real GitHub Action with this job's OIDC token, against a kind install
  # that trusts GitHub's issuer for this repository only. The install sits behind
  # Envoy Gateway; target/e2e/api-ca.pem is the Gateway's self-signed certificate.
  action:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    # Fork PRs get no id-token, so the Action cannot authenticate there.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Install the controller on kind
        run: |
          cargo xtask e2e-up "$GITHUB_REPOSITORY"
          echo "BK_URL=$(cat target/e2e/api-url)" >> "$GITHUB_ENV"
          {
            echo 'BK_CA<<BK_CA_EOF'
            cat target/e2e/api-ca.pem
            echo 'BK_CA_EOF'
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ctx"
          echo multi > "$RUNNER_TEMP/ctx/note"
          printf 'FROM scratch\nCOPY note /note\n' > "$RUNNER_TEMP/ctx/Dockerfile"
      - name: Allocate a worker
        id: bk
        uses: ./action
        with:
          url: ${{ env.BK_URL }}
          pools: ci/amd64
          ca-cert: ${{ env.BK_CA }}
      - name: Build through the builder the Action created
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ runner.temp }}/ctx
          builder: ${{ steps.bk.outputs.builder }}
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
      - name: Show controller logs on failure
        if: failure()
        run: |
          kubectl --kubeconfig target/e2e/kubeconfig get pods -A
          kubectl --kubeconfig target/e2e/kubeconfig -n bk-system logs deploy/buildkit-controller --tail=100
          kubectl --kubeconfig target/e2e/kubeconfig get gateway,httproute,tlsroute,backendtlspolicy -A -o yaml
          kubectl --kubeconfig target/e2e/kubeconfig -n envoy-gateway-system logs deploy/envoy-gateway --tail=100

  # The remaining kind suites, nightly and on demand only. Each leg has its own runner, so none
  # needs a BK_KIND_SUFFIX.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [alloc-verify, api-verify, runtime-verify, reconcile-verify, edge-verify, claim-verify, proxy-verify]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo xtask ${{ matrix.suite }}

  # Cert-lifecycle soak (cargo xtask soak). Long: nightly and on demand only.
  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo xtask soak

  # Controller shutdown never cuts a live build: a 390 s build survives a rollout,
  # the Lease moves within seconds, and a queued request on a stopping replica
  # gets 503 shutting_down (cargo xtask drain-verify). Slow: nightly and on demand only.
  drain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo xtask drain-verify
