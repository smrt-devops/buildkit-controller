name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push or pull request update cancels the older run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One kind cluster and one end-to-end build through the chart. The full kind sweep runs
  # locally before a release (.github/workflows/README.md). The suite log is kept as an artifact.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The test image needs no LTO or single codegen unit: this cuts the warm compile from about
    # 5 minutes to 2. The release workflow builds the shipped binary with the full profile.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        # Caches target/ (release included), where the image build now compiles the controller.
        # The key names the profile above, so a profile change saves a fresh cache.
        with:
          key: release-nolto
      - run: cargo xtask kind-all --only e2e
      - name: Show the runner's disk and memory on failure
        if: failure()
        run: df -h / && free -m && docker system df
      - name: Keep the suite log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kind-all-logs
          path: target/kind-all/*.log
          if-no-files-found: ignore

  # examples/*.yaml against the CRDs in a real API server, so a field rename that breaks the files
  # the README tells users to apply fails here.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Dry-run every example on a throwaway cluster
        run: |
          set -euo pipefail
          kind create cluster --name bk-examples --wait 120s
          trap 'kind delete cluster --name bk-examples' EXIT
          kubectl apply --server-side -f helm/buildkit-controller/crds/
          kubectl wait --for condition=established --timeout=60s crd --all
          kubectl create namespace ci
          kubectl create namespace apps
          for f in examples/pool-*.yaml examples/claim-pod.yaml; do
            echo "== $f"
            kubectl apply --dry-run=server --validate=strict -f "$f"
          done
