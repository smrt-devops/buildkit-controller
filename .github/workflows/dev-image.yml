name: Dev image

# Builds a test image from this branch only. Not part of a release.
on:
  push:
    branches: [tunnel-dev]

permissions: {}

env:
  IMAGE: ghcr.io/smrt-devops/buildkit-controller

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile in the pinned trixie rust image
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm -v "$PWD:/src" -w /src -v "$PWD/dist:/out" "$(cat docker/builder-image)" \
            sh -euc 'cargo build --release --locked -p buildkit-controller --bin buildkit-controller --target-dir /tmp/target
              cp /tmp/target/release/buildkit-controller /out/buildkit-controller'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: dist
          file: docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:0.4.0-tunnel.${{ github.run_number }}
