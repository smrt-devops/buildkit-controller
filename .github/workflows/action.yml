name: Action

on:
  push:
    branches: [main]
  pull_request:
    paths: ['action/**', 'docs/ci/**', '.github/workflows/action.yml']

permissions:
  contents: read

# A newer push or pull request update cancels the older run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test action/test/*.test.js
      - name: action.yml is valid YAML
        run: yq . action/action.yml > /dev/null
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck docs/ci/*.sh
