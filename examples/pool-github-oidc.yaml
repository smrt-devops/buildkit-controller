# Access rules for GitHub Actions. A caller may use the pool if any rule matches,
# and every claim inside one rule must match. "*" matches any characters.
# The issuer must equal an auth.oidc[].url in the Helm values, byte for byte.
apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitPool
metadata:
  name: amd64
  namespace: ci
spec:
  platforms: [linux/amd64]
  access:
    rules:
      # Any workflow in a repository of this organization, on the main branch.
      - oidc:
          issuer: https://token.actions.githubusercontent.com
          claims:
            repository_owner_id: "12345678"   # the org's numeric id (gh api orgs/<org> --jq .id); names can be re-registered
            ref: refs/heads/main
            event_name: push   # pull_request_target runs can run fork code, so admit pushes only
          exclude:
            repo_property_domain: [pci]   # see the last rule
      # One repository, any ref, but only pushes from release workflows.
      - oidc:
          issuer: https://token.actions.githubusercontent.com
          claims:
            repository_id: "87654321"   # the repository's numeric id (gh api repos/<owner>/<name> --jq .id)
            event_name: push
            job_workflow_ref: smrt-devops/app/.github/workflows/release.yml@*
          exclude:
            repo_property_domain: [pci]
      # Every domain of one organization except pci. "*" requires the claim to be present and
      # non-empty, and is allowed because repository_owner_id pins the rule. exclude stops only
      # its own rule from matching: another rule in the list can still admit a pci repository,
      # so the rules above exclude pci too. It also works in spec.workers.cache.writers.
      - oidc:
          issuer: https://token.actions.githubusercontent.com
          claims:
            repository_owner_id: "12345678"
            repo_property_domain: "*"
          exclude:
            repo_property_domain: [pci]
      # In-cluster jobs that run as the builder ServiceAccount in this namespace.
      - serviceAccount:
          name: builder
