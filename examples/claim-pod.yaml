# A BuildKitClaim and a pod that builds through it. The claim and the pod run in `apps`,
# not in the pool namespace `ci`, which holds no other workloads. Needs the chart installed
# with `apps` in `claims.namespaces`, and a pool in `ci`
# whose access rules admit the `apps` namespace, for example:
#
#   spec:
#     access:
#       rules:
#       - claims: {namespaces: [apps]}
#
# The controller writes Secret `build-42-buildkit` once the claim is Bound.
# Deleting the claim releases the worker; the Secret goes with it.
# If the worker pod goes away before the TTL, the claim turns Lost and its
# Secret is deleted. Create a new claim; a lost one is never rebound.
apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitClaim
metadata:
  name: build-42
  namespace: apps
spec:
  poolRef: {namespace: ci, name: default}
  ttl: 30m
---
# In Tekton, this is one step that mounts the Secret as a workspace or volume.
# The pod stays Pending (CreateContainerConfigError) until the Secret exists.
apiVersion: v1
kind: Pod
metadata:
  name: build-42
  namespace: apps
spec:
  restartPolicy: Never
  containers:
  - name: build
    image: moby/buildkit:v0.34.0-rootless
    command: [sh, -c]
    args:
    - |
      printf 'FROM busybox\nRUN echo built > /out\n' > /tmp/Dockerfile
      # The Secret has no ca.crt when the edge serves a publicly trusted certificate.
      CA=
      [ ! -f /certs/ca.crt ] || CA="--tlscacert /certs/ca.crt"
      buildctl --addr "$BUILDKIT_HOST" \
        --tlsservername "$BUILDKIT_SERVER_NAME" \
        $CA --tlscert /certs/tls.crt --tlskey /certs/tls.key \
        build --frontend dockerfile.v0 --local context=/tmp --local dockerfile=/tmp
    env:
    - name: BUILDKIT_HOST
      valueFrom: {secretKeyRef: {name: build-42-buildkit, key: endpoint}}
    - name: BUILDKIT_SERVER_NAME
      valueFrom: {secretKeyRef: {name: build-42-buildkit, key: server-name}}
    volumeMounts:
    - {name: certs, mountPath: /certs, readOnly: true}
  volumes:
  - name: certs
    secret: {secretName: build-42-buildkit}
# With buildx instead of buildctl:
# (leave out cacert= when the Secret has no ca.crt)
#   docker buildx create --name claim --driver remote \
#     --driver-opt cacert=/certs/ca.crt,cert=/certs/tls.crt,key=/certs/tls.key,servername=$BUILDKIT_SERVER_NAME \
#     "$BUILDKIT_HOST"
#   docker buildx build --builder claim .
