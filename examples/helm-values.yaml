# Values for: helm install bk helm/buildkit-controller -n buildkit-system -f helm-values.yaml
replicaCount: 2

# edge.endpoint is empty, so builds tunnel through the API route: one hostname and one HTTPS
# route are enough. For TLS passthrough instead, see helm-values-tcp.yaml.
edge:
  serverName: bk.example.com

# Behind a gateway every client shares the gateway's addresses, so the per-address caps apply
# to all CI jobs together. Size them for the jobs that start at once. The chart renders
# edge.maxHandshakesPerIp as 0 here, because a tunnel handshake counts against that address.
api:
  maxConnectionsPerIp: 1024

# Pool namespaces. The controller gets a Role in each and no cluster-wide write
# access; pools in other namespaces are ignored.
watchNamespaces: [ci]

auth:
  oidc:
    - url: https://token.actions.githubusercontent.com
      audiences: [buildkit-controller]
  serviceAccount:
    enabled: true
    audiences: [buildkit-controller]
    maxReviewsPerIp: 32

# The API route on the Gateway bk (namespace gateway-system), on its HTTPS listener, where
# the Gateway's certificate is publicly trusted. See helm/buildkit-controller/README.md#exposure
# for a Gateway to match.
gateway:
  api:
    parentRefs: [{name: bk, namespace: gateway-system, sectionName: api}]
  # envoy: {enabled: true}   # Envoy Gateway only: keepalive and timeout policies

# Without a Gateway, expose the Service instead: drop the gateway block and use
#
#   service:
#     type: LoadBalancer
#     annotations:
#       # AWS NLB: the tunnel pings every 20 s, so any idle timeout above 30 s is enough.
#       service.beta.kubernetes.io/aws-load-balancer-listener-attributes.TCP-8443: tcp.idle_timeout.seconds=900

metrics:
  serviceMonitor:
    enabled: auto

# The chart creates these pools. The namespaces must already exist.
pools:
  - name: amd64
    namespace: ci
    spec:
      platforms: [linux/amd64]
      scaling:
        max: 10
      access:
        rules:
          - oidc:
              issuer: https://token.actions.githubusercontent.com
              claims:
                repository_owner_id: "12345678"   # the org's numeric id (gh api orgs/<org> --jq .id); names can be re-registered
                event_name: push   # not pull_request_target, which can run fork code
