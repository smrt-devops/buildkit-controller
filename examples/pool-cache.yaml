# Build cache settings of a pool. Every pool uses the chart's built-in cache
# registry (cache.enabled, on by default); this one changes who may write it.
#
# Each repository has its own cache (scope: identity, the default). A build
# reads its repository's cache, and writes it only when a writers rule matches
# the caller. Without writers, push, schedule, workflow_dispatch and
# merge_group events and in-cluster callers write; pull requests only read.
# Here only pushes to main write, so branch builds start warm from main
# without changing it.
apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitPool
metadata:
  name: app
  namespace: ci
spec:
  scaling: {min: 2, max: 8}
  workers:
    cache:
      maxSize: 20Gi
      writers:
        - oidc:
            issuer: https://token.actions.githubusercontent.com
            claims: {event_name: push, ref: refs/heads/main}
  access:
    rules:
      - oidc:
          issuer: https://token.actions.githubusercontent.com
          claims:
            repository_id: "87654321"   # gh api repos/example/app --jq .id; names can be re-registered
