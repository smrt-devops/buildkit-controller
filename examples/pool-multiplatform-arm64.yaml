# Half of a multi-platform pair. Apply this file and its sibling, then list
# both pools in the Action as `pools` entries ci/amd64 and ci/arm64.
apiVersion: buildkit.smrt-devops.net/v1alpha1
kind: BuildKitPool
metadata:
  name: arm64
  namespace: ci
spec:
  platforms: [linux/arm64]
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
  access:
    rules:
      - oidc:
          issuer: https://token.actions.githubusercontent.com
          claims:
            repository_owner_id: "12345678"   # the org's numeric id (gh api orgs/<org> --jq .id); names can be re-registered
