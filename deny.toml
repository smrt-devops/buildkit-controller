[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # bincode 1.3.3 is complete and frozen, not vulnerable. promql-parser reaches
  # it through lrpar, and only xtask (publish = false) depends on that parser.
  { id = "RUSTSEC-2025-0141", reason = "unmaintained, no vulnerability; reached only through the xtask dashboard check" },
  # object_store has no release without chrono and humantime yet, and the
  # xtask promql-parser also uses chrono. Neither advisory is a vulnerability.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; reached through object_store and the xtask promql-parser" },
  { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained, no vulnerability; reached through object_store" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
