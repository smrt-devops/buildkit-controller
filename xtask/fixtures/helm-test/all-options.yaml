nameOverride: bkc
replicaCount: 3
image: {repository: registry.example.com/bkc, tag: v9.9.9, pullPolicy: Always}
imagePullSecrets: [{name: regcred}]
podDisruptionBudget: {enabled: true, minAvailable: 2}
resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 1Gi}}
logLevel: debug
logFormat: text
watchNamespace: ci
edge:
  endpoint: tcp://bk.example.com:9444
  serverName: bk.example.com
  allocationDomain: alloc.bk.example.com
  extraNames: [bk-alt.example.com, 203.0.113.7]
  tls: {secretName: bk-serving}
  handshakeTimeout: 5s
  maxConnections: 20000
  maxHandshakes: 512
  maxHandshakesPerIp: 16
api: {maxConnections: 2048, maxConnectionsPerIp: 64}
auth:
  oidc:
    - url: https://token.actions.githubusercontent.com
      audiences: [buildkit-controller]
    - url: https://oidc.internal.example.com
      audiences: [bkc, bkc-alt]
      jwksUrl: https://oidc.internal.example.com/keys
      caBundle: "-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----\n"
    - url: https://oidc.other.example.com
      audiences: [bkc]
      caBundleConfigMap: {name: other-ca, key: root.pem}
  serviceAccount: {enabled: true, audiences: [bkc], maxConcurrentReviews: 8, maxReviewsPerIp: 2}
workerNetwork:
  clusterCIDRs: [10.244.0.0/16, 10.96.0.0/12, "fd00::/48"]
  extraDeniedCIDRs: [203.0.113.0/24]
  permittedCIDRs: [169.254.20.10/32]
  dns: {namespace: kube-system, podLabels: {k8s-app: kube-dns}, cidrs: [169.254.20.10/32]}
shutdown: {delay: 10s, drainTimeout: 10m}
service:
  type: NodePort
  annotations: {example.com/idle-timeout: "900"}
  loadBalancerClass: example.com/lb
  externalTrafficPolicy: Local
  ports: {api: 9443, edge: 9444}
  nodePorts: {api: 30443, edge: 30444}
metrics:
  port: 9090
  serviceMonitor: {enabled: true, interval: 15s, labels: {release: prom}}
serviceAccount:
  annotations: {example.com/role: controller}
podAnnotations: {example.com/x: "1"}
podLabels: {team: ci}
nodeSelector: {kubernetes.io/os: linux}
tolerations: [{key: dedicated, operator: Equal, value: ci, effect: NoSchedule}]
affinity: {podAntiAffinity: {preferredDuringSchedulingIgnoredDuringExecution: [{weight: 100, podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app.kubernetes.io/name: buildkit-controller}}}}]}}
topologySpreadConstraints: [{maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: buildkit-controller}}}]
priorityClassName: system-cluster-critical
gateway:
  enabled: true
  parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: shared, namespace: gateway-system, port: 443}]
  annotations: {example.com/route: "1"}
  labels: {exposure: gateway}
  api:
    mode: terminate
    parentRefs: [{name: shared, namespace: gateway-system, sectionName: https}]
    hostnames: [api.bk.example.com]
    timeouts: {request: 20m, backendRequest: 19m}
    backendTLS:
      hostname: bk-alt.example.com
      caCertificateRefs: [{group: "", kind: ConfigMap, name: serving-ca}]
  edge:
    parentRefs: [{name: shared, namespace: gateway-system, sectionName: bk-edge}]
  envoy:
    enabled: false
    connectTimeout: 10s
    tcpKeepalive: {idleTime: 30s, interval: 10s, probes: 3}
  extraManifests: []
