edge: {endpoint: "tcp://bk.example.com:8444", serverName: bk.example.com}
watchNamespaces: [ci-builders]
cache:
  maxSize: 100Gi
  poolMaxSize: 20Gi
  gcInterval: 30m
  persistence: {size: 150Gi, storageClass: fast}
  podAnnotations: {team: ci}
  nodeSelector: {disk: ssd}
pools:
  - name: shared
    spec:
      workers:
        cache:
          scope: pool
          maxSize: 5Gi
          writers: [{serviceAccount: {name: builder}}]
gateway: {enabled: false}
