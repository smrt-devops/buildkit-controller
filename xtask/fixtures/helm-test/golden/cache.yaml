# Source: buildkit-controller/templates/registry.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkit-controller-registry
  namespace: buildkit-system
  labels:
    app.kubernetes.io/name: buildkit-registry
    app.kubernetes.io/instance: bk
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: buildkit-controller-0.1.0
spec:
  replicas: 1
  serviceName: buildkit-controller-registry
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit-registry
      app.kubernetes.io/instance: bk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit-registry
        app.kubernetes.io/instance: bk
        app.kubernetes.io/component: registry
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        helm.sh/chart: buildkit-controller-0.1.0
      annotations:
        team: ci
    spec:
      serviceAccountName: buildkit-controller-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: "ghcr.io/smrt-devops/buildkit-controller:0.1.0"
          imagePullPolicy: IfNotPresent
          args: [registry]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          env:
            - {name: LOG_LEVEL, value: "info"}
            - {name: LOG_FORMAT, value: "json"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: BUILDKIT_CACHE_OPS_LISTEN, value: "0.0.0.0:8080"}
            - {name: BUILDKIT_CACHE_MAX_SIZE, value: "100Gi"}
            - {name: BUILDKIT_CACHE_POOL_MAX_SIZE, value: "20Gi"}
            - {name: BUILDKIT_CACHE_MAX_BLOB_SIZE, value: "5Gi"}
            - {name: BUILDKIT_CACHE_MAX_UPLOAD_SIZE, value: "10Gi"}
            - {name: BUILDKIT_CACHE_GC_INTERVAL, value: "30m"}
            - {name: BUILDKIT_CACHE_WATCH_NAMESPACES, value: "ci-builders"}
          ports:
            - {name: registry, containerPort: 5000}
            - {name: ops, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/buildkit-cache}
            - {name: tls, mountPath: /etc/buildkit-cache/tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: buildkit-controller-registry-tls, defaultMode: 0440}
      nodeSelector:
        disk: ssd
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "fast"
        resources:
          requests: {storage: "150Gi"}

