apiVersion: apps/v1
kind: Deployment
metadata:
  name: bkc
  namespace: buildkit-system
  labels:
    app.kubernetes.io/name: buildkit-controller
    app.kubernetes.io/instance: bk
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
    helm.sh/chart: buildkit-controller-0.2.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit-controller
      app.kubernetes.io/instance: bk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit-controller
        app.kubernetes.io/instance: bk
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.2.0"
        helm.sh/chart: buildkit-controller-0.2.0
        team: ci
      annotations:
        checksum/config: b27c11905c8f227afda0e9a10c8ea94a73e07b410c984f219854ea482c9e2be1
        example.com/x: "1"
    spec:
      serviceAccountName: bkc
      terminationGracePeriodSeconds: 620
      imagePullSecrets:
        - name: regcred
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: "registry.example.com/bkc:v9.9.9"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          env:
            - {name: LOG_LEVEL, value: "debug"}
            - {name: LOG_FORMAT, value: "text"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: api, containerPort: 8443}
            - {name: edge, containerPort: 8444}
            - {name: ops, containerPort: 9090}
          startupProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - {name: config, mountPath: /etc/buildkit-controller, readOnly: true}
            - {name: oidc-ca-2, mountPath: /etc/buildkit-controller/oidc-ca/2, readOnly: true}
      volumes:
        - name: config
          configMap: {name: bkc-config}
        - name: oidc-ca-2
          configMap: {name: other-ca}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: ci
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: buildkit-controller
              topologyKey: kubernetes.io/hostname
            weight: 100
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: buildkit-controller
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway

