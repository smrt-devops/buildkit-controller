# Source: buildkit-controller/templates/registry.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bkc-registry
  namespace: buildkit-system
  labels:
    app.kubernetes.io/name: buildkit-registry
    app.kubernetes.io/instance: bk
    app.kubernetes.io/component: registry
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.2.0"
    helm.sh/chart: buildkit-controller-0.2.0
spec:
  replicas: 1
  serviceName: bkc-registry
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit-registry
      app.kubernetes.io/instance: bk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit-registry
        app.kubernetes.io/instance: bk
        app.kubernetes.io/component: registry
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.2.0"
        helm.sh/chart: buildkit-controller-0.2.0
    spec:
      serviceAccountName: bkc-registry
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: "registry.example.com/bkc:v9.9.9"
          imagePullPolicy: Always
          args: [registry]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          env:
            - {name: LOG_LEVEL, value: "debug"}
            - {name: LOG_FORMAT, value: "text"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: BUILDKIT_CACHE_OPS_LISTEN, value: "0.0.0.0:9090"}
            - {name: BUILDKIT_CACHE_MAX_SIZE, value: "40Gi"}
            - {name: BUILDKIT_CACHE_POOL_MAX_SIZE, value: "10Gi"}
            - {name: BUILDKIT_CACHE_MAX_BLOB_SIZE, value: "5Gi"}
            - {name: BUILDKIT_CACHE_MAX_UPLOAD_SIZE, value: "10Gi"}
            - {name: BUILDKIT_CACHE_GC_INTERVAL, value: "10m"}
            - {name: BUILDKIT_CACHE_WATCH_NAMESPACES, value: "ci"}
          ports:
            - {name: registry, containerPort: 5000}
            - {name: ops, containerPort: 9090}
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: data, mountPath: /var/lib/buildkit-cache}
            - {name: tls, mountPath: /etc/buildkit-cache/tls, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: bkc-registry-tls, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: "60Gi"}

