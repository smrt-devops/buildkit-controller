apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit-controller
  namespace: buildkit-system
  labels:
    app.kubernetes.io/name: buildkit-controller
    app.kubernetes.io/instance: bk
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: buildkit-controller-0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit-controller
      app.kubernetes.io/instance: bk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit-controller
        app.kubernetes.io/instance: bk
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        helm.sh/chart: buildkit-controller-0.1.0
      annotations:
        checksum/config: 9e57360d393363d0de7509ca6870f35581f5610032e0e689ca839ed63b4e981b
    spec:
      serviceAccountName: buildkit-controller
      terminationGracePeriodSeconds: 86715
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: "ghcr.io/smrt-devops/buildkit-controller:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          env:
            - {name: LOG_LEVEL, value: "info"}
            - {name: LOG_FORMAT, value: "json"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: api, containerPort: 8443}
            - {name: edge, containerPort: 8444}
            - {name: ops, containerPort: 8080}
          startupProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: config, mountPath: /etc/buildkit-controller, readOnly: true}
      volumes:
        - name: config
          configMap: {name: buildkit-controller-config}
