# The shared cluster of `cargo xtask kind-all` (see xtask/src/kind_all.rs): the
# union of what the suites that run on it need.
# - e2e: the pod and service ranges of KIND_CIDRS in xtask/src/e2e.rs, and its
#   Gateway's NodePorts 30080 and 30081 on the loopback ports E2E_API and E2E_EDGE.
# - drain-verify: the chart's NodePorts 30082 and 30083 on DRAIN_API and DRAIN_EDGE.
# - reconcile-verify: the API server audit log of its controller's requests
#   (the policy logs that ServiceAccount and nothing else).
# - every suite at once: room for more than the default 110 pods.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    maxPods: 250
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: E2E_API, listenAddress: "127.0.0.1"}
      - {containerPort: 30081, hostPort: E2E_EDGE, listenAddress: "127.0.0.1"}
      - {containerPort: 30082, hostPort: DRAIN_API, listenAddress: "127.0.0.1"}
      - {containerPort: 30083, hostPort: DRAIN_EDGE, listenAddress: "127.0.0.1"}
    extraMounts:
      - hostPath: POLICY_DIR
        containerPath: /etc/kubernetes/policies
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/audit.log
            audit-policy-file: /etc/kubernetes/policies/audit.yaml
          extraVolumes:
          - name: audit-policies
            hostPath: /etc/kubernetes/policies
            mountPath: /etc/kubernetes/policies
            readOnly: true
            pathType: DirectoryOrCreate
          - name: audit-logs
            hostPath: /var/log/kubernetes
            mountPath: /var/log/kubernetes
            readOnly: false
            pathType: DirectoryOrCreate
