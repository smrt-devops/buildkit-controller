# A Gateway a suite's routes attach to: GW_NAME in namespace GW_NS, of the
# GatewayClass GW_CLASS (filled in by xtask/src/gateway.rs). Each suite on a
# shared cluster has its own, so their routes never meet. The TLS passthrough
# listeners in passthrough-listeners.yaml go at the end for e2e and proxy-verify;
# tunnel-verify's Gateway has only the HTTPS listener. e2e's Envoy Service is
# a NodePort on the ports the kind config publishes on loopback; proxy-verify's
# is a ClusterIP Service that the host reaches through kubectl port-forward;
# tunnel-verify's is a NodePort for the HTTPS listener alone.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: GW_CLASS
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        # The harness loads this image into kind. Without this line Envoy Gateway
        # v1.9.3 used its built-in image reference here and pulled it in the cluster.
        container: {image: docker.io/envoyproxy/envoy:distroless-v1.39.5}
      envoyService:
ENVOY_SERVICE
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: GW_CLASS
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: GW_CLASS
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: GW_NAME
  namespace: GW_NS
spec:
  gatewayClassName: GW_CLASS
  listeners:
    # The API: TLS ends here with the bk-gateway-api certificate, and the
    # HTTPRoute's BackendTLSPolicy re-encrypts to the controller.
    - name: api
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{name: bk-gateway-api}]
      allowedRoutes:
        namespaces: {from: All}
PASSTHROUGH_LISTENERS
