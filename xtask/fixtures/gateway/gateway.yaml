# The Gateway the e2e install attaches to. Envoy's Service is a NodePort on
# 30443 (API) and 30444 (edge), which xtask/fixtures/e2e/kind.yaml publishes on
# 127.0.0.1:18443 and :18444.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        # The harness loads this image into kind. Without this line Envoy Gateway
        # v1.9.3 used its built-in image reference here and pulled it in the cluster.
        container: {image: docker.io/envoyproxy/envoy:distroless-v1.39.5}
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - {port: 8443, nodePort: 30443}
                - {port: 8444, nodePort: 30444}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: bk-e2e
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bk
  namespace: bk-gateway
spec:
  gatewayClassName: bk-e2e
  listeners:
    # The API: TLS ends here with the bk-gateway-api certificate, and the
    # HTTPRoute's BackendTLSPolicy re-encrypts to the controller.
    - name: api
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs: [{name: bk-gateway-api}]
      allowedRoutes:
        namespaces: {from: All}
    # The edge: passthrough, so the controller sees the client certificate.
    - name: edge
      protocol: TLS
      port: 8444
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces: {from: All}
    # The API by passthrough, for gateway.api.mode=passthrough.
    - name: api-passthrough
      protocol: TLS
      port: 9443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces: {from: All}
