# Minimal in-cluster controller for `cargo xtask edge-verify`, soak and perf.
# The binary runs every component: election, reconciler, alloc, http (API) and
# edge. Its ServiceAccount and RBAC are not here: the tasks render them from the
# chart (templates/serviceaccount.yaml and templates/rbac.yaml), so they test the
# RBAC that ships.
apiVersion: v1
kind: ConfigMap
metadata: {name: buildkit-controller, namespace: buildkit-system}
data:
  config.yaml: |
    edge:
      endpoint: tcp://bk.example.com:8444
      serverName: bk.example.com
    shutdown:
      delay: 0s
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: buildkit-controller, namespace: buildkit-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: buildkit-controller}}
  template:
    # The worker NetworkPolicy admits pods by app.kubernetes.io/name.
    metadata: {labels: {app: buildkit-controller, app.kubernetes.io/name: buildkit-controller}}
    spec:
      serviceAccountName: buildkit-controller
      # PodSecurity "restricted". The controller writes nothing to its root fs.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: buildkit-controller:dev
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          args: [--log-format=text]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: edge, containerPort: 8444}
            - {name: ops, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/buildkit-controller}
      volumes:
        - name: config
          configMap: {name: buildkit-controller}
---
apiVersion: v1
kind: Service
metadata: {name: buildkit-controller, namespace: buildkit-system}
spec:
  selector: {app: buildkit-controller}
  ports:
    - {name: edge, port: 8444, targetPort: edge}
    - {name: ops, port: 8080, targetPort: ops}
