# The host ports API_PORT and EDGE_PORT (filled in by `cargo xtask drain-verify`)
# reach the chart's NodePorts 30082 and 30083 (API and edge). By default they are
# 28443 and 28444, apart from e2e's, so both suites can run on one host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30082, hostPort: API_PORT, listenAddress: "127.0.0.1"}
      - {containerPort: 30083, hostPort: EDGE_PORT, listenAddress: "127.0.0.1"}
