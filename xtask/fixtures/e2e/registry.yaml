apiVersion: v1
kind: Namespace
metadata: {name: e2e-reg}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: e2e-reg}
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: Never
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: e2e-reg}
spec:
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000}]
