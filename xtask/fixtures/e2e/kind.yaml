# Host ports 18443/18444 reach the chart's NodePorts 30443/30444 (API, edge).
# Host ports 18443 and 18444 reach the chart's NodePorts 30443 and 30444 (API and edge).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30443, hostPort: 18443, listenAddress: "127.0.0.1"}
      - {containerPort: 30444, hostPort: 18444, listenAddress: "127.0.0.1"}
