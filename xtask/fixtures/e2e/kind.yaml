# Host ports 18443 and 18444 reach the NodePorts 30443 and 30444 of the Envoy
# Gateway Service (API and edge listeners), set in xtask/fixtures/gateway/gateway.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30443, hostPort: 18443, listenAddress: "127.0.0.1"}
      - {containerPort: 30444, hostPort: 18444, listenAddress: "127.0.0.1"}
