# The host ports API_PORT and EDGE_PORT (filled in by `cargo xtask e2e`, see
# HostPorts in xtask/src/e2e.rs) reach the NodePorts 30080 and 30081 of the Envoy
# Gateway Service (API and edge listeners), set by `gateway::E2E` in xtask/src/gateway.rs.
# The pod and service ranges match KIND_CIDRS in xtask/src/e2e.rs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: API_PORT, listenAddress: "127.0.0.1"}
      - {containerPort: 30081, hostPort: EDGE_PORT, listenAddress: "127.0.0.1"}
