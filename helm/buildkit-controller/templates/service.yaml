{{- $fn := include "bkc.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "bkc.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with (ternary .Values.service.loadBalancerClass "" (eq .Values.service.type "LoadBalancer")) }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with (ternary .Values.service.externalTrafficPolicy "" (ne .Values.service.type "ClusterIP")) }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector: {{- include "bkc.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.service.ports.api }}
      targetPort: api
      {{- with (ternary .Values.service.nodePorts.api "" (ne .Values.service.type "ClusterIP")) }}
      nodePort: {{ . }}
      {{- end }}
    - name: edge
      port: {{ .Values.service.ports.edge }}
      targetPort: edge
      {{- with (ternary .Values.service.nodePorts.edge "" (ne .Values.service.type "ClusterIP")) }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bkc.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector: {{- include "bkc.selectorLabels" . | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: ops}
